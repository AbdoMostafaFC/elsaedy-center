<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>إضافة منتج</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fbf3ee;color:#4a2c34;padding:16px}
.box{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e3c98f;border-radius:18px;padding:20px;box-shadow:0 6px 20px rgba(120,60,70,.08)}
h1{font-size:20px;margin:0 0 16px;text-align:center;color:#a2485f}
label{display:block;margin:12px 0 4px;font-size:14px;font-weight:bold}
input,select,textarea{width:100%;padding:12px;border:1px solid #d9c3a0;border-radius:10px;font:inherit;font-size:16px;background:#fffdfb}
textarea{min-height:90px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px}.chk input{width:auto}.chk label{margin:0}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#4a2c34;color:#fff;font:inherit;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#msg{margin-top:14px;padding:12px;border-radius:10px;display:none;text-align:center;font-weight:bold}
.ok{background:#e6f4ea;color:#1e6b34}.err{background:#fde8e8;color:#9b1c1c}
small{color:#8a6a5a}
</style></head><body>
<div class="box">
<h1>إضافة منتج جديد</h1>
<form id="f">
<label for="name">اسم المنتج *</label><input id="name" required>
<label for="price">السعر <small>(اتركه فاضي = اسأل عن السعر)</small></label><input id="price" placeholder="مثال: ٧٦٠ جنيه">
<label for="cat">القسم *</label>
<select id="cat" required>
<option>أطقم سرير</option><option>فوط وبورنس</option><option>أطفال</option><option>بطاطين وكوفرتات</option><option>ستائر</option>
</select>
<label for="img">رابط الصورة <small>(رابط واحد أو أكثر، بينهم فاصلة)</small></label><input id="img" type="url" dir="ltr" placeholder="https://...">
<div class="chk"><input type="checkbox" id="offer"><label for="offer">ضمن العروض</label></div>
<label for="desc">وصف</label><textarea id="desc"></textarea>
<label for="sec">الرمز السري *</label><input id="sec" type="password" dir="ltr" required autocomplete="off">
<button id="go" type="submit">إضافة المنتج</button>
</form>
<div id="msg"></div>
</div>
<script>
var EXEC='https://script.google.com/macros/s/AKfycbwgWsZYDDEzsYx4zR7YjnnRKmS9k2tqYIo7yuMdohQLrJKEXizqjmCO1-ZTpTYafaxV2A/exec';
var f=document.getElementById('f'),m=document.getElementById('msg'),b=document.getElementById('go'),s=document.getElementById('sec');
s.value=localStorage.getItem('esy_s')||'';
function show(t,c){m.textContent=t;m.className=c;m.style.display='block';}
f.addEventListener('submit',function(e){
 e.preventDefault();b.disabled=true;m.style.display='none';
 var d={secret:s.value.trim(),name:document.getElementById('name').value,price:document.getElementById('price').value,
  category:document.getElementById('cat').value,image:document.getElementById('img').value,
  offer:document.getElementById('offer').checked,desc:document.getElementById('desc').value};
 fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)})
 .then(function(r){return r.json();})
 .then(function(j){
  if(j.ok){localStorage.setItem('esy_s',d.secret);show('تمت الإضافة ✓ المنتج هيظهر في الموقع خلال دقائق','ok');
   ['name','price','img','desc'].forEach(function(i){document.getElementById(i).value='';});document.getElementById('offer').checked=false;}
  else if(j.error==='wrong_secret')show('الرمز السري غلط','err');
  else if(j.error==='missing_name')show('اكتب اسم المنتج','err');
  else show('حصلت مشكلة، حاول تاني','err');
 }).catch(function(){show('تعذر الاتصال، تأكد من النت وحاول تاني','err');})
 .then(function(){b.disabled=false;});
});
</script></body></html>
